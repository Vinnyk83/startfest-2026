<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — StartFEST 2026</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<header class="site-header"><div id="site-nav"></div></header>

<div class="card form-card" style="max-width:520px;">
  <h1>Your profile</h1>
  <form id="profile-form" novalidate>
    <div class="field">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" required>
    </div>
    <div class="field">
      <label for="jobTitle">Job title</label>
      <input type="text" id="jobTitle" name="jobTitle">
    </div>
    <div class="field">
      <label for="company">Company</label>
      <input type="text" id="company" name="company">
    </div>
    <div class="field">
      <label for="bio">Short bio</label>
      <textarea id="bio" name="bio" rows="3" maxlength="500"></textarea>
      <div class="char-count"><span id="bio-count">0</span>/500</div>
    </div>
    <div class="field">
      <label for="linkedinUrl">LinkedIn URL</label>
      <input type="url" id="linkedinUrl" name="linkedinUrl" placeholder="https://linkedin.com/in/…">
    </div>
    <div class="field">
      <label>Avatar color</label>
      <div class="color-swatches" id="color-swatches"></div>
    </div>
    <div class="field">
      <div class="toggle-row">
        <input type="checkbox" id="shareAttendance" style="width:auto;">
        <label for="shareAttendance" style="margin:0;">Share my attendance with other attendees</label>
      </div>
      <p class="help-text">When on, your name appears on session attendee lists. When off, you're counted privately instead.</p>
    </div>
    <button type="submit" class="btn btn--primary" id="submit-btn" style="width:100%;">Save changes</button>
  </form>

  <div class="detail-section">
    <h2>Calendar feed</h2>
    <p class="help-text">Subscribe to your schedule in any calendar app:</p>
    <div class="subscribe-box">
      <input type="text" id="feed-url" readonly>
      <button type="button" class="btn btn--outline btn--sm" id="copy-feed-btn">Copy link</button>
    </div>
  </div>

  <div class="detail-section">
    <button type="button" class="btn btn--outline" id="logout-btn">Log out</button>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
