<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings – StartFEST Admin</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="light-shell">
<div id="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1>Settings</h1>
        <p>Drives the public site's header and footer. Changes appear there within about 15 seconds.</p>
      </div>
    </div>

    <div class="card settings-form" id="settings-card">
      <p class="admin-loading">Loading&hellip;</p>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/admin/admin.js"></script>
<script>
(function () {
  const card = document.getElementById('settings-card');
  let settings = null;
  let days = [];

  async function boot() {
    await AdminApp.init();
    try {
      [settings, days] = await Promise.all([
        AdminApp.api('/api/admin/settings'),
        AdminApp.api('/api/admin/days'),
      ]);
      render();
    } catch (err) {
      card.innerHTML = '<p class="admin-empty">Failed to load settings.</p>';
      App.toast(err.message || 'Failed to load settings.', 'error');
    }
  }

  function partnerRowHtml(partner, idx) {
    const v = (val) => App.escapeHtml(val == null ? '' : val);
    return `<div class="partner-row" data-partner-idx="${idx}">
      <input class="partner-name" placeholder="Partner name" value="${v(partner && partner.name)}">
      <input class="partner-logo" placeholder="Logo URL (optional)" value="${v(partner && partner.logoUrl)}">
      <button type="button" class="btn btn--outline btn--sm remove-partner-btn">Remove</button>
    </div>`;
  }

  function render() {
    const v = (val) => App.escapeHtml(val == null ? '' : val);
    const partners = settings.partners || [];
    const sortedDays = [...days].sort((a, b) => a.dayNumber - b.dayNumber);

    card.innerHTML = `
      <form id="settings-form">
        <h2>Conference identity</h2>
        <div class="field">
          <label for="st-name">Name</label>
          <input id="st-name" value="${v(settings.name)}">
        </div>
        <div class="field">
          <label for="st-presenter">Presenter</label>
          <input id="st-presenter" value="${v(settings.presenter)}">
        </div>
        <div class="field">
          <label for="st-tagline">Tagline</label>
          <input id="st-tagline" value="${v(settings.tagline)}">
        </div>
        <div class="field">
          <label>Date range label</label>
          <div class="readonly-box">${v(settings.dateRangeLabel) || '&mdash;'} <span class="field-note">(computed automatically from the conference day dates below — not editable here)</span></div>
        </div>

        <h2>Venue</h2>
        <div class="field">
          <label for="st-venueName">Venue name</label>
          <input id="st-venueName" value="${v(settings.venueName)}">
        </div>
        <div class="field">
          <label for="st-venueSecondary">Venue secondary line</label>
          <input id="st-venueSecondary" value="${v(settings.venueSecondary)}">
        </div>
        <div class="field">
          <label for="st-venueAddress">Venue address</label>
          <input id="st-venueAddress" value="${v(settings.venueAddress)}">
        </div>
        <div class="field">
          <label for="st-timezone">Timezone</label>
          <input id="st-timezone" value="${v(settings.timezone)}">
        </div>

        <h2>Footer</h2>
        <div class="field">
          <label for="st-footerNote">Footer note</label>
          <textarea id="st-footerNote" rows="2">${v(settings.footerNote)}</textarea>
        </div>

        <h2>Partners</h2>
        <div id="partners-list">
          ${partners.map(partnerRowHtml).join('') || ''}
        </div>
        <button type="button" class="btn btn--outline btn--sm" id="add-partner-btn">Add partner</button>

        <h2>Conference days (read-only)</h2>
        <div class="readonly-box">
          <div class="days-readonly-list">
            ${sortedDays
              .map((d) => `<div>Day ${d.dayNumber} &mdash; ${App.escapeHtml(App.formatDayDate(d.date))}${d.label ? ' &middot; ' + App.escapeHtml(d.label) : ''}</div>`)
              .join('') || '<div>No conference days configured.</div>'}
          </div>
          <p class="field-note" style="margin-top:10px;">To change conference dates, edit CONFERENCE_START_DATE and re-run the setup script — see README.</p>
        </div>

        <div class="modal-actions" style="margin-top:24px;">
          <button type="submit" class="btn btn--primary">Save changes</button>
        </div>
      </form>`;

    document.getElementById('add-partner-btn').addEventListener('click', () => {
      const list = document.getElementById('partners-list');
      const div = document.createElement('div');
      div.innerHTML = partnerRowHtml(null, list.children.length);
      const row = div.firstElementChild;
      list.appendChild(row);
      wirePartnerRemove(row);
    });
    document.querySelectorAll('.remove-partner-btn').forEach((btn) => wirePartnerRemove(btn.closest('.partner-row')));

    document.getElementById('settings-form').addEventListener('submit', onSubmit);
  }

  function wirePartnerRemove(row) {
    const btn = row.querySelector('.remove-partner-btn');
    btn.addEventListener('click', () => row.remove());
  }

  async function onSubmit(e) {
    e.preventDefault();
    const partners = Array.from(document.querySelectorAll('#partners-list .partner-row'))
      .map((row) => ({
        name: row.querySelector('.partner-name').value.trim(),
        logoUrl: row.querySelector('.partner-logo').value.trim() || undefined,
      }))
      .filter((p) => p.name);

    const body = {
      name: document.getElementById('st-name').value.trim(),
      presenter: document.getElementById('st-presenter').value.trim(),
      tagline: document.getElementById('st-tagline').value.trim(),
      venueName: document.getElementById('st-venueName').value.trim(),
      venueSecondary: document.getElementById('st-venueSecondary').value.trim(),
      venueAddress: document.getElementById('st-venueAddress').value.trim(),
      timezone: document.getElementById('st-timezone').value.trim(),
      footerNote: document.getElementById('st-footerNote').value.trim(),
      partners,
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      settings = await AdminApp.api('/api/admin/settings', { method: 'PATCH', body });
      App.toast('Settings saved.', 'success');
      render();
    } catch (err) {
      App.toast(err.message || 'Could not save settings.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
