<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – StartFEST Admin</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="light-shell">
<div id="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1>Dashboard</h1>
        <p>Snapshot of StartFEST 2026 registrations and users.</p>
      </div>
    </div>

    <div id="stat-grid" class="stat-grid">
      <div class="stat-tile skeleton" style="height:76px"></div>
      <div class="stat-tile skeleton" style="height:76px"></div>
      <div class="stat-tile skeleton" style="height:76px"></div>
      <div class="stat-tile skeleton" style="height:76px"></div>
      <div class="stat-tile skeleton" style="height:76px"></div>
      <div class="stat-tile skeleton" style="height:76px"></div>
    </div>

    <div class="admin-dashboard-grid">
      <div class="card">
        <h2>Recent Registrations</h2>
        <div id="recent-reg-list" class="recent-reg-list">
          <p class="admin-loading">Loading&hellip;</p>
        </div>
      </div>
      <div class="card">
        <h2>Quick links</h2>
        <div class="quick-links">
          <a href="/admin/users">Manage Users &rarr;</a>
          <a href="/admin/speakers">Manage Speakers &rarr;</a>
          <a href="/admin/sessions">Manage Sessions &rarr;</a>
          <a href="/admin/settings">Conference Settings &rarr;</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/admin/admin.js"></script>
<script>
  (async function () {
    await AdminApp.init();
    try {
      const stats = await AdminApp.api('/api/admin/stats');
      renderStats(stats);
      renderRecent(stats.recentRegistrations || []);
    } catch (err) {
      App.toast(err.message || 'Failed to load dashboard stats.', 'error');
      document.getElementById('stat-grid').innerHTML = '<p class="admin-empty">Could not load stats.</p>';
      document.getElementById('recent-reg-list').innerHTML = '<p class="admin-empty">Could not load recent registrations.</p>';
    }
  })();

  function tile(label, value, warn) {
    return `<div class="stat-tile">
      <div class="stat-value${warn ? ' stat-value--warn' : ''}">${App.escapeHtml(String(value))}</div>
      <div class="stat-label">${App.escapeHtml(label)}</div>
    </div>`;
  }

  function renderStats(stats) {
    document.getElementById('stat-grid').innerHTML = [
      tile('Total Users', stats.totalUsers),
      tile('Active Users', stats.activeUsers),
      tile('Total Sessions', stats.totalSessions),
      tile('Total Registrations', stats.totalRegistrations),
      tile('Avg Sessions / User', stats.avgSessionsPerUser),
      tile('Users with Conflicts', stats.usersWithConflicts, stats.usersWithConflicts > 0),
    ].join('');
  }

  function formatWhen(iso) {
    try {
      return new Date(iso).toLocaleString('en-US', {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      });
    } catch (e) {
      return '';
    }
  }

  function renderRecent(list) {
    const host = document.getElementById('recent-reg-list');
    if (!list.length) {
      host.innerHTML = '<p class="admin-empty">No registrations yet.</p>';
      return;
    }
    host.innerHTML = list
      .map((r) => {
        const user = r.user || {};
        return `<div class="recent-reg-row">
          ${App.initialsAvatar(user.fullName || 'Unknown', user.avatarColor, 32)}
          <div class="recent-reg-main">
            <strong>${App.escapeHtml(user.fullName || 'Unknown user')}</strong>
            <span>registered for ${App.escapeHtml(r.session || 'a session')}</span>
          </div>
          <time>${formatWhen(r.createdAt)}</time>
        </div>`;
      })
      .join('');
  }
</script>
</body>
</html>
